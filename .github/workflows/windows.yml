name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

# Windows exercises the same headless UI suite, the DSL gallery/benchmark, and the native Win32
# smoke targets as the local build script. CoralCore/CoralGraphics and the shared third-party tree
# are checked out at the paths scripts/build-windows.ps1 probes.
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout CoralUI
        uses: actions/checkout@v4

      - name: Checkout CoralCore
        uses: actions/checkout@v4
        with:
          repository: CoralFrameworks/CoralCore
          ref: main
          path: external/CoralCore
          submodules: recursive

      - name: Checkout CoralGraphics
        uses: actions/checkout@v4
        with:
          repository: CoralFrameworks/CoralGraphics
          ref: main
          path: external/CoralGraphics
          submodules: recursive

      - name: Checkout zlib
        uses: actions/checkout@v4
        with:
          repository: CoralFrameworks/libz
          ref: main
          path: third_party/libz
          submodules: recursive

      - name: Checkout GoogleTest
        uses: actions/checkout@v4
        with:
          repository: CoralFrameworks/libgtest
          ref: main
          path: third_party/libgtest
          submodules: recursive

      - name: Checkout CoralGraphics zlib
        uses: actions/checkout@v4
        with:
          repository: CoralFrameworks/libz
          ref: main
          path: external/CoralGraphics/third_party/libz
          submodules: recursive

      - name: Checkout libyuv
        uses: actions/checkout@v4
        with:
          repository: CoralFrameworks/libyuv
          ref: main
          path: external/CoralGraphics/third_party/libyuv
          submodules: recursive

      - name: Build and test
        shell: cmd
        run: |
          scripts\build-windows.cmd -Tests > windows-build.log 2>&1
          if errorlevel 1 (
            type windows-build.log
            exit /b 1
          )

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            windows-build.log
            out/windows/**/*.log
            out/windows/**/*.png
          if-no-files-found: ignore
          retention-days: 7
